name: Deploy Laravel image to a controlled container host
description: Transfer an allowlisted Compose definition and invoke the governed remote deployment wrapper
inputs:
  image-reference:
    description: Immutable OCI image reference including digest
    required: true
  compose-path:
    description: Repository-relative Compose definition
    required: true
  services:
    description: Comma-separated allowlisted services
    required: true
  health-timeout-seconds:
    description: Bounded health timeout
    required: true
  health-retries:
    description: Bounded health retry count
    required: true
  lkg-image-digest:
    description: Previous last-known-good image digest
    required: false
  attempt-id:
    description: Governed deployment attempt identifier
    required: true
outputs:
  terminal-status:
    value: ${{ steps.deploy.outputs.terminalStatus }}
  active-digest:
    value: ${{ steps.deploy.outputs.activeDigest }}
  health-status:
    value: ${{ steps.deploy.outputs.healthStatus }}
  previous-lkg-digest:
    value: ${{ steps.deploy.outputs.previousLkgDigest }}
  resulting-lkg-digest:
    value: ${{ steps.deploy.outputs.resultingLkgDigest }}
  rollback-status:
    value: ${{ steps.deploy.outputs.rollbackStatus }}
  failure-category:
    value: ${{ steps.deploy.outputs.failureCategory }}
runs:
  using: composite
  steps:
    - name: Execute controlled deployment
      id: deploy
      shell: bash
      env:
        DEPLOY_SSH_PRIVATE_KEY: ${{ env.DEPLOY_SSH_PRIVATE_KEY }}
        DEPLOY_KNOWN_HOSTS: ${{ env.DEPLOY_KNOWN_HOSTS }}
        DEPLOY_TARGET_HOST: ${{ env.DEPLOY_TARGET_HOST }}
        DEPLOY_TARGET_USER: ${{ env.DEPLOY_TARGET_USER }}
        DEPLOY_ATTEMPT_ID: ${{ inputs.attempt-id }}
      run: |
        set +e
        result=$("$GITHUB_ACTION_PATH/../../scripts/container-host-deploy.sh" \
          '${{ inputs.image-reference }}' '${{ inputs.compose-path }}' '${{ inputs.services }}' \
          '${{ inputs.health-timeout-seconds }}' '${{ inputs.health-retries }}' '${{ inputs.lkg-image-digest }}')
        status=$?
        set -e
        while IFS= read -r line; do
          [[ "$line" =~ ^(terminalStatus|activeDigest|healthStatus|previousLkgDigest|resultingLkgDigest|rollbackStatus|failureCategory)= ]] && echo "$line" >> "$GITHUB_OUTPUT"
        done <<< "$result"
        exit "$status"
