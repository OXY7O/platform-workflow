name: Validate Go Service contract
description: Validate typed Go Service caller input without exposing sensitive values
inputs:
  contract-json:
    description: JSON Go Service caller contract
    required: true
outputs:
  contract-digest:
    description: SHA-256 digest of the canonical contract
  profile-key:
    description: Resolved profile key
  go-version:
    description: Resolved Go version
  binary-name:
    description: Resolved binary name
runs:
  using: node24
  main: ../../dist/validate-go-service-contract/index.js
