name: Validate Laravel OCI build contract
description: Validate controlled OCI publication input without exposing sensitive values
inputs:
  contract-json:
    description: JSON OCI build contract
    required: true
outputs:
  contract-digest:
    description: SHA-256 digest of the canonical contract
  canonical-contract:
    description: Validated canonical contract JSON
  image-repository:
    description: Validated registry repository without tag or digest
  platforms:
    description: Validated comma-separated OCI platforms
runs:
  using: node24
  main: ../../dist/validate-oci-build/index.js
