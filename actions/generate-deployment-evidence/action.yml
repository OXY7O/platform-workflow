name: Generate safe deployment evidence
description: Emit allowlist-only deployment metadata without credentials, network details, environment values, or raw logs
inputs:
  result-json:
    description: Controlled deployment result JSON
    required: true
outputs:
  evidence-json:
    description: Validated compact safe evidence JSON
  terminal-status:
    description: Terminal deployment status
  rollback-status:
    description: Rollback outcome
runs:
  using: node24
  main: ../../dist/generate-deployment-evidence/index.js
