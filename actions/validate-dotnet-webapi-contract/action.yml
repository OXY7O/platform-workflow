name: Validate .NET Web API contract
description: Validate typed .NET Web API caller input without exposing sensitive values
inputs:
  contract-json:
    description: JSON .NET Web API caller contract
    required: true
outputs:
  contract-digest:
    description: SHA-256 digest of the canonical contract
  profile-key:
    description: Resolved profile key
  sdk-version:
    description: Resolved .NET SDK version
  artifact-name:
    description: Resolved artifact name
runs:
  using: node24
  main: ../../dist/validate-dotnet-webapi-contract/index.js
