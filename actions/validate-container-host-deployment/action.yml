name: Validate Laravel container-host deployment contract
description: Validate controlled development deployment metadata without accepting credentials or arbitrary commands
inputs:
  contract-json:
    description: JSON container-host deployment contract
    required: true
outputs:
  contract-digest:
    description: SHA-256 digest of the canonical deployment contract
  canonical-contract:
    description: Validated canonical deployment contract JSON
  image-reference:
    description: Immutable OCI image reference
  image-digest:
    description: Immutable OCI image digest
  target-id:
    description: Governed logical deployment target
runs:
  using: node24
  main: ../../dist/validate-container-host-deployment/index.js
