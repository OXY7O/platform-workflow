profile_key: php-laravel
family_key: php
structure_markers: [artisan, bootstrap/app.php, composer.json, composer.lock]
test_presets: [phpunit, pest]
required_checks: [unit-test, artifact-verify]
artifact_type: application-package
prohibited_artifact_patterns:
  - "**/.env*"
  - "**/*.pem"
  - "**/*.key"
  - "**/id_rsa*"
  - "**/.git/**"
  - "**/node_modules/**"
  - "**/tests/**"
