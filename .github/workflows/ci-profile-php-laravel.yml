name: Reusable PHP Laravel CI

on:
  workflow_call:
    inputs:
      contract-json: {required: true, type: string}
      php-version: {required: true, type: string}
      test-profile: {required: false, type: string, default: phpunit}
      working-directory: {required: false, type: string, default: "."}
      retention-days: {required: false, type: number, default: 14}
    outputs:
      readiness:
        value: ${{ jobs.package.outputs.readiness }}
      failure-category:
        value: ${{ jobs.package.outputs.failure-category }}
      artifact-id:
        value: ${{ jobs.package.outputs.artifact-id }}
      artifact-name:
        value: ${{ jobs.package.outputs.artifact-name }}
      artifact-digest:
        value: ${{ jobs.package.outputs.artifact-digest }}
      manifest-digest:
        value: ${{ jobs.package.outputs.manifest-digest }}
      evidence-metadata:
        value: ${{ jobs.package.outputs.evidence-metadata }}

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    outputs:
      readiness: ${{ steps.normalize.outputs.readiness }}
      failure-category: ${{ steps.normalize.outputs.failure-category }}
      artifact-id: ${{ steps.build.outputs.artifact-id }}
      artifact-name: ${{ steps.build.outputs.artifact-name }}
      artifact-digest: ${{ steps.build.outputs.digest }}
      manifest-digest: ${{ steps.build.outputs.manifest-digest }}
      evidence-metadata: ${{ steps.normalize.outputs.evidence-metadata }}
    steps:
      - name: Checkout caller source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate caller contract
        id: contract
        uses: OXY7O/platform-workflow/actions/validate-caller-contract@40b7d0bd8a4c4cf98e7b938518cfad2a9a55094b
        with:
          contract: ${{ inputs.contract-json }}
      - name: Configure PHP runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ inputs.php-version }}
          tools: composer
          coverage: xdebug
      - name: Recreate frozen dependencies
        uses: OXY7O/platform-workflow/actions/php-family-check@40b7d0bd8a4c4cf98e7b938518cfad2a9a55094b
        with:
          working-directory: ${{ inputs.working-directory }}
          dependency-mode: composer-frozen
      - name: Run Laravel profile checks
        uses: OXY7O/platform-workflow/actions/laravel-profile-check@40b7d0bd8a4c4cf98e7b938518cfad2a9a55094b
        with:
          working-directory: ${{ inputs.working-directory }}
          test-profile: ${{ inputs.test-profile }}
      - name: Resolve dependency lock digest
        id: lock
        working-directory: ${{ inputs.working-directory }}
        run: echo "digest=sha256:$(sha256sum composer.lock | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Prepare verified package input
        id: package-input
        run: |
          value="$(node -e 'JSON.parse(process.argv[1]); console.log(JSON.stringify({workingDirectory:process.argv[2],outputDirectory:process.env.RUNNER_TEMP+"/artifacts",sourceSha:process.env.GITHUB_SHA,workflowSha:process.argv[3],contractDigest:process.argv[4],lockDigest:process.argv[5],retentionDays:Number(process.argv[6])}))' '${{ inputs.contract-json }}' '${{ inputs.working-directory }}' '40b7d0bd8a4c4cf98e7b938518cfad2a9a55094b' '${{ steps.contract.outputs.contract-digest }}' '${{ steps.lock.outputs.digest }}' '${{ inputs.retention-days }}')"
          echo "value=$value" >> "$GITHUB_OUTPUT"
      - name: Build verified application package
        id: build
        uses: OXY7O/platform-workflow/actions/build-application-package@40b7d0bd8a4c4cf98e7b938518cfad2a9a55094b
        with:
          build-input: ${{ steps.package-input.outputs.value }}
      - name: Upload qualified package
        id: upload
        if: steps.build.outputs.readiness == 'ci-qualified'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.build.outputs.artifact-name }}
          path: |
            ${{ steps.build.outputs.artifact-path }}
            ${{ steps.build.outputs.manifest-path }}
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error
      - name: Collect granular check results
        id: checks
        if: always()
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          # shellcheck disable=SC2016 -- JavaScript template literals are intentional.
          node -e '
            const fs = require("node:fs");
            const file = process.env.RUNNER_TEMP + "/platform-results/checks.jsonl";
            const results = fs.existsSync(file)
              ? fs.readFileSync(file, "utf8").trim().split("\n").filter(Boolean).map(JSON.parse)
              : [];
            const expected = ["sensitive-material-guard", "php-syntax", "composer-lock", "dependency-audit", "unit-test"];
            for (const id of expected) {
              if (!results.some((result) => result.id === id)) {
                results.push({id, required: true, status: "not-run", failureCategory: null, safeDiagnostic: null});
              }
            }
            const artifactPassed = process.env.BUILD_OUTCOME === "success" && process.env.UPLOAD_OUTCOME === "success";
            const artifactFailed = process.env.BUILD_OUTCOME === "failure" || process.env.UPLOAD_OUTCOME === "failure";
            results.push({
              id: "artifact-verify",
              required: true,
              status: artifactPassed ? "passed" : artifactFailed ? "failed" : "not-run",
              failureCategory: artifactPassed ? null : "artifact",
              safeDiagnostic: null,
            });
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `checks-json=${JSON.stringify(results)}\n`);
          '
      - name: Build safe evidence
        id: evidence
        if: always()
        shell: bash
        env:
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          CONTRACT_DIGEST: ${{ steps.contract.outputs.contract-digest }}
          ARTIFACT_ID: ${{ steps.build.outputs.artifact-id }}
          ARTIFACT_NAME: ${{ steps.build.outputs.artifact-name }}
          ARTIFACT_DIGEST: ${{ steps.build.outputs.digest }}
          MANIFEST_DIGEST: ${{ steps.build.outputs.manifest-digest }}
          RETENTION_DAYS: ${{ inputs.retention-days }}
        run: |
          # shellcheck disable=SC2016 -- JavaScript template literals are intentional.
          node -e '
            const fs = require("node:fs");
            const uploaded = process.env.UPLOAD_OUTCOME === "success";
            const artifact = uploaded ? {
              artifactId: process.env.ARTIFACT_ID,
              artifactName: process.env.ARTIFACT_NAME,
              digest: process.env.ARTIFACT_DIGEST,
              manifestDigest: process.env.MANIFEST_DIGEST,
              retentionDays: Number(process.env.RETENTION_DAYS),
            } : null;
            const evidence = {
              schemaVersion: "1.0",
              governanceVersion: "v1.5.1",
              catalogueVersion: "1.4.0",
              profileKey: "php-laravel",
              sourceSha: process.env.GITHUB_SHA,
              workflowSha: "40b7d0bd8a4c4cf98e7b938518cfad2a9a55094b",
              contractDigest: process.env.CONTRACT_DIGEST,
              runnerClass: "linux-x64",
              runnerImage: "ubuntu-24.04",
              artifact,
              evidenceReference: null,
            };
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `evidence-json=${JSON.stringify(evidence)}\n`);
          '
      - name: Normalize result and evidence
        id: normalize
        if: always()
        uses: OXY7O/platform-workflow/actions/normalize-check-results@40b7d0bd8a4c4cf98e7b938518cfad2a9a55094b
        with:
          checks: ${{ steps.checks.outputs.checks-json }}
          evidence: ${{ steps.evidence.outputs.evidence-json }}
