name: Reusable PHP Laravel CI

on:
  workflow_call:
    inputs:
      contract-json: {required: true, type: string}
      php-version: {required: true, type: string}
      test-profile: {required: false, type: string, default: phpunit}
      working-directory: {required: false, type: string, default: "."}
      coverage-threshold: {required: false, type: number, default: 80}
      retention-days: {required: false, type: number, default: 14}
    outputs:
      readiness:
        value: ${{ jobs.package.outputs.readiness }}
      failure-category:
        value: ${{ jobs.package.outputs.failure-category }}
      artifact-id:
        value: ${{ jobs.package.outputs.artifact-id }}
      artifact-name:
        value: ${{ jobs.package.outputs.artifact-name }}
      artifact-digest:
        value: ${{ jobs.package.outputs.artifact-digest }}
      manifest-digest:
        value: ${{ jobs.package.outputs.manifest-digest }}
      evidence-metadata:
        value: ${{ jobs.package.outputs.evidence-metadata }}

permissions:
  contents: read

jobs:
  family:
    uses: ./.github/workflows/ci-family-php.yml
    permissions:
      contents: read
    with:
      contract-json: ${{ inputs.contract-json }}
      php-version: ${{ inputs.php-version }}
      working-directory: ${{ inputs.working-directory }}

  package:
    needs: family
    runs-on: ubuntu-24.04
    env:
      XDEBUG_MODE: coverage
    container:
      image: ghcr.io/oxy7o/platform-ci-php@sha256:e406cd0def2e69f3ca9800ab68ede80ad7f3a5fd7b23dc20b1927371d867db69
    outputs:
      readiness: ${{ steps.normalize.outputs.readiness }}
      failure-category: ${{ steps.normalize.outputs.failure-category }}
      artifact-id: ${{ steps.build.outputs.artifact-id }}
      artifact-name: ${{ steps.build.outputs.artifact-name }}
      artifact-digest: ${{ steps.build.outputs.digest }}
      manifest-digest: ${{ steps.build.outputs.manifest-digest }}
      evidence-metadata: ${{ steps.normalize.outputs.evidence-metadata }}
    steps:
      - name: Checkout caller source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Recreate frozen dependencies
        uses: OXY7O/platform-workflow/actions/php-family-check@94cd54f1bceaa3ee334c10f14c68f768123e828e
        with:
          working-directory: ${{ inputs.working-directory }}
          dependency-mode: composer-frozen
      - name: Run Laravel profile checks
        uses: OXY7O/platform-workflow/actions/laravel-profile-check@94cd54f1bceaa3ee334c10f14c68f768123e828e
        with:
          working-directory: ${{ inputs.working-directory }}
          test-profile: ${{ inputs.test-profile }}
          coverage-threshold: ${{ inputs.coverage-threshold }}
      - name: Resolve dependency lock digest
        id: lock
        working-directory: ${{ inputs.working-directory }}
        run: echo "digest=sha256:$(sha256sum composer.lock | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Prepare verified package input
        id: package-input
        run: |
          value="$(node -e 'JSON.parse(process.argv[1]); console.log(JSON.stringify({workingDirectory:process.argv[2],outputDirectory:process.env.RUNNER_TEMP+"/artifacts",sourceSha:process.env.GITHUB_SHA,workflowSha:process.argv[3],contractDigest:process.argv[4],lockDigest:process.argv[5],retentionDays:Number(process.argv[6])}))' '${{ inputs.contract-json }}' '${{ inputs.working-directory }}' '4058870b25de8a9432762f144381d6c416644e2c' '${{ needs.family.outputs.contract-digest }}' '${{ steps.lock.outputs.digest }}' '${{ inputs.retention-days }}')"
          echo "value=$value" >> "$GITHUB_OUTPUT"
      - name: Build verified application package
        id: build
        uses: OXY7O/platform-workflow/actions/build-application-package@4058870b25de8a9432762f144381d6c416644e2c
        with:
          build-input: ${{ steps.package-input.outputs.value }}
      - name: Upload qualified package
        id: upload
        if: steps.build.outputs.readiness == 'ci-qualified'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.build.outputs.artifact-name }}
          path: |
            ${{ steps.build.outputs.artifact-path }}
            ${{ steps.build.outputs.manifest-path }}
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error
      - name: Normalize result and evidence
        id: normalize
        if: always()
        uses: OXY7O/platform-workflow/actions/normalize-check-results@4058870b25de8a9432762f144381d6c416644e2c
        with:
          checks: >-
            [{"id":"artifact-verify","required":true,"status":"${{ steps.build.outcome == 'success' && 'passed' || 'failed' }}","failureCategory":${{ steps.build.outcome == 'success' && 'null' || '"artifact"' }},"safeDiagnostic":null}]
          evidence: >-
            {"schemaVersion":"1.0","governanceVersion":"v1.5.0","catalogueVersion":"1.2.0","profileKey":"php-laravel","sourceSha":"${{ github.sha }}","workflowSha":"4058870b25de8a9432762f144381d6c416644e2c","contractDigest":"${{ needs.family.outputs.contract-digest }}","runnerClass":"linux-x64","runnerImage":"ghcr.io/oxy7o/platform-ci-php@sha256:e406cd0def2e69f3ca9800ab68ede80ad7f3a5fd7b23dc20b1927371d867db69","artifact":{"artifactId":"${{ steps.build.outputs.artifact-id }}","artifactName":"${{ steps.build.outputs.artifact-name }}","digest":"${{ steps.build.outputs.digest }}","manifestDigest":"${{ steps.build.outputs.manifest-digest }}","retentionDays":${{ inputs.retention-days }}},"evidenceReference":null}
