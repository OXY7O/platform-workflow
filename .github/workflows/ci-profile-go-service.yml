name: Reusable Go Service CI

on:
  workflow_call:
    inputs:
      contract-json: {required: true, type: string}
      compatibility-catalogue-path: {required: false, type: string, default: compatibility/go-service.json}
    outputs:
      readiness:
        value: ${{ jobs.package.outputs.readiness }}
      failure-category:
        value: ${{ jobs.package.outputs.failure-category }}
      artifact-id:
        value: ${{ jobs.package.outputs.artifact-id }}
      artifact-name:
        value: ${{ jobs.package.outputs.artifact-name }}
      artifact-digest:
        value: ${{ jobs.package.outputs.artifact-digest }}
      manifest-digest:
        value: ${{ jobs.package.outputs.manifest-digest }}
      evidence-metadata:
        value: ${{ jobs.package.outputs.evidence-metadata }}

permissions:
  contents: read

jobs:
  family:
    uses: ./.github/workflows/ci-family-go.yml
    permissions:
      contents: read
    with:
      contract-json: ${{ inputs.contract-json }}

  package:
    needs: family
    runs-on: ubuntu-24.04
    outputs:
      readiness: ${{ steps.normalize.outputs.readiness }}
      failure-category: ${{ steps.normalize.outputs.failure-category }}
      artifact-id: ${{ steps.build.outputs.artifact-id }}
      artifact-name: ${{ steps.build.outputs.artifact-name }}
      artifact-digest: ${{ steps.build.outputs.digest }}
      manifest-digest: ${{ steps.build.outputs.manifest-digest }}
      evidence-metadata: ${{ steps.normalize.outputs.evidence-metadata }}
    steps:
      - name: Checkout caller source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate Go Service contract
        id: contract
        uses: OXY7O/platform-workflow/actions/validate-go-service-contract@c9314ac3fd75042b5e8d569a38d851419c83f258
        with:
          contract-json: ${{ inputs.contract-json }}
      - name: Configure canonical Go 1.26.7
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.26.7
          cache: true
          cache-dependency-path: ${{ fromJSON(inputs.contract-json).workingDirectory }}/go.sum
      - name: Re-run governed family checks
        id: family-check
        uses: OXY7O/platform-workflow/actions/go-family-check@c9314ac3fd75042b5e8d569a38d851419c83f258
        with:
          working-directory: ${{ fromJSON(inputs.contract-json).workingDirectory }}
          go-version: 1.26.7
          coverage-threshold: ${{ fromJSON(inputs.contract-json).coverageThreshold }}
      - name: Build verified Go Service binary
        id: profile
        uses: OXY7O/platform-workflow/actions/go-service-check@c9314ac3fd75042b5e8d569a38d851419c83f258
        with:
          working-directory: ${{ fromJSON(inputs.contract-json).workingDirectory }}
          main-package: ${{ fromJSON(inputs.contract-json).mainPackage }}
          binary-output: ${{ runner.temp }}/go-canonical/${{ fromJSON(inputs.contract-json).binaryName }}
      - name: Prepare binary artifact input
        id: artifact-input
        env:
          CONTRACT_JSON: ${{ inputs.contract-json }}
          CONTRACT_DIGEST: ${{ steps.contract.outputs.contract-digest }}
          MODULE_DIGEST: ${{ needs.family.outputs.module-digest }}
          BINARY_PATH: ${{ runner.temp }}/go-canonical/${{ fromJSON(inputs.contract-json).binaryName }}
        run: |
          value="$(node -e 'const c=JSON.parse(process.env.CONTRACT_JSON); console.log(JSON.stringify({binaryPath:process.env.BINARY_PATH,outputDirectory:process.env.RUNNER_TEMP+"/go-artifacts",binaryName:c.binaryName,applicationVersion:c.applicationVersion,sourceSha:process.env.GITHUB_SHA,workflowSha:"c9314ac3fd75042b5e8d569a38d851419c83f258",contractDigest:process.env.CONTRACT_DIGEST,moduleDigest:process.env.MODULE_DIGEST,goVersion:"1.26.7",targetOs:"linux",targetArch:"amd64",retentionDays:c.retentionDays}))')"
          echo "value=$value" >> "$GITHUB_OUTPUT"
      - name: Package verified Go binary
        id: build
        uses: OXY7O/platform-workflow/actions/build-go-binary-artifact@c9314ac3fd75042b5e8d569a38d851419c83f258
        with:
          build-input: ${{ steps.artifact-input.outputs.value }}
      - name: Upload qualified Go binary
        if: steps.build.outputs.readiness == 'ci-qualified'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.build.outputs.artifact-name }}
          path: |
            ${{ steps.build.outputs.artifact-path }}
            ${{ steps.build.outputs.manifest-path }}
          retention-days: ${{ fromJSON(inputs.contract-json).retentionDays }}
          if-no-files-found: error
      - name: Normalize canonical result
        id: normalize
        if: always()
        uses: OXY7O/platform-workflow/actions/normalize-check-results@c9314ac3fd75042b5e8d569a38d851419c83f258
        with:
          checks: >-
            [{"id":"go-family","required":true,"status":"${{ steps.family-check.outcome == 'success' && 'passed' || 'failed' }}","failureCategory":${{ steps.family-check.outcome == 'success' && 'null' || '"quality"' }},"safeDiagnostic":null},{"id":"go-service-build","required":true,"status":"${{ steps.profile.outcome == 'success' && 'passed' || 'failed' }}","failureCategory":${{ steps.profile.outcome == 'success' && 'null' || '"configuration"' }},"safeDiagnostic":null},{"id":"binary-artifact","required":true,"status":"${{ steps.build.outcome == 'success' && 'passed' || 'failed' }}","failureCategory":${{ steps.build.outcome == 'success' && 'null' || '"artifact"' }},"safeDiagnostic":null}]
          evidence: >-
            {"schemaVersion":"1.0","governanceVersion":"v1.2.0","catalogueVersion":"1.2.0","profileKey":"go-service","sourceSha":"${{ github.sha }}","workflowSha":"c9314ac3fd75042b5e8d569a38d851419c83f258","contractDigest":"${{ steps.contract.outputs.contract-digest }}","runnerClass":"linux-x64","runnerImage":"ubuntu-24.04","artifact":{"artifactId":"${{ steps.build.outputs.artifact-id }}","artifactName":"${{ steps.build.outputs.artifact-name }}","digest":"${{ steps.build.outputs.digest }}","manifestDigest":"${{ steps.build.outputs.manifest-digest }}","retentionDays":${{ fromJSON(inputs.contract-json).retentionDays }},"type":"binary"},"evidenceReference":null}

  prepare-compatibility:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix-json }}
    steps:
      - name: Checkout caller source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Generate governed Go compatibility matrix
        id: matrix
        uses: OXY7O/platform-workflow/actions/generate-go-compatibility-matrix@c9314ac3fd75042b5e8d569a38d851419c83f258
        with:
          catalogue-path: ${{ inputs.compatibility-catalogue-path }}

  compatibility:
    needs: [prepare-compatibility]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-compatibility.outputs.matrix) }}
    uses: ./.github/workflows/ci-compatibility-go-service.yml
    permissions:
      contents: read
    with:
      contract-json: ${{ toJSON(matrix) }}
      go-version: ${{ matrix.goVersion }}
      working-directory: ${{ matrix.workingDirectory }}
      main-package: ${{ fromJSON(inputs.contract-json).mainPackage }}
      coverage-threshold: ${{ fromJSON(inputs.contract-json).coverageThreshold }}
