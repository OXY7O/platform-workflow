name: Reusable PHP family CI

on:
  workflow_call:
    inputs:
      contract-json: {required: true, type: string}
      php-version: {required: true, type: string}
      working-directory: {required: false, type: string, default: "."}
    outputs:
      contract-digest:
        description: Validated caller contract digest
        value: ${{ jobs.php-family.outputs.contract-digest }}
      checks-json:
        description: Normalized PHP family checks
        value: ${{ jobs.php-family.outputs.checks-json }}

permissions:
  contents: read

jobs:
  php-family:
    runs-on: [self-hosted, platform-ci]
    env:
      COMPOSER_ALLOW_SUPERUSER: "1"
      COMPOSER_CACHE_DIR: /var/cache/platform/composer
    container:
      image: ${{ inputs.php-version == '8.2' && 'php:8.2-cli-bookworm@sha256:6ca4b01d84082465358c5d541a2bef0edd9d0be494802aeb40f2d7c7a8d73adb' || inputs.php-version == '8.3' && 'php:8.3-cli-bookworm@sha256:177529735599a8244b2c903522f029839dce1c2ac4be122fdc00ada4b45a20e4' || inputs.php-version == '8.4' && 'php:8.4-cli-bookworm@sha256:9cc9310a457019cd6b682109eb3c5dd8bf73498e7d3b9ee5c33d0d0b83d0faf3' || inputs.php-version == '8.5' && 'php:8.5-cli-bookworm@sha256:b80dfc7d2bc0fc97755620a0dfb3d5e8e9cbf70a2970ea2d5c9dc64154b31422' || '' }}
      volumes:
        - platform-ci-composer-php-${{ inputs.php-version }}:/var/cache/platform/composer
    outputs:
      contract-digest: ${{ steps.contract.outputs.contract-digest }}
      checks-json: ${{ steps.results.outputs.checks-json }}
    steps:
      - name: Checkout caller source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate caller contract
        id: contract
        uses: OXY7O/platform-workflow/actions/validate-caller-contract@40b7d0bd8a4c4cf98e7b938518cfad2a9a55094b
        with:
          contract: ${{ inputs.contract-json }}
      - name: Configure PHP tooling in job container
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ inputs.php-version }}
          tools: composer
          coverage: none
      - name: Run PHP family checks
        uses: OXY7O/platform-workflow/actions/php-family-check@40b7d0bd8a4c4cf98e7b938518cfad2a9a55094b
        with:
          working-directory: ${{ inputs.working-directory }}
          dependency-mode: composer-frozen
      - name: Export family result
        id: results
        if: always()
        shell: bash
        run: |
          results_file="${RUNNER_TEMP}/platform-results/checks.jsonl"
          checks=""
          if [[ -f "$results_file" ]]; then
            checks="$(tr '\n' ',' < "$results_file" | sed 's/,$//')"
          fi
          echo "checks-json=[$checks]" >> "$GITHUB_OUTPUT"
