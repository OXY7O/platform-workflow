name: Reusable PHP family CI

on:
  workflow_call:
    inputs:
      contract-json: {required: true, type: string}
      php-version: {required: true, type: string}
      working-directory: {required: false, type: string, default: "."}
    outputs:
      contract-digest:
        description: Validated caller contract digest
        value: ${{ jobs.php-family.outputs.contract-digest }}
      checks-json:
        description: Normalized PHP family checks
        value: ${{ jobs.php-family.outputs.checks-json }}

permissions:
  contents: read

jobs:
  php-family:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/oxy7o/platform-ci-php@sha256:e406cd0def2e69f3ca9800ab68ede80ad7f3a5fd7b23dc20b1927371d867db69
    outputs:
      contract-digest: ${{ steps.contract.outputs.contract-digest }}
      checks-json: ${{ steps.results.outputs.checks-json }}
    steps:
      - name: Checkout caller source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate caller contract
        id: contract
        uses: OXY7O/platform-workflow/actions/validate-caller-contract@4058870b25de8a9432762f144381d6c416644e2c
        with:
          contract: ${{ inputs.contract-json }}
      - name: Verify approved PHP runtime
        shell: bash
        run: |
          actual="$(php -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION;')"
          [[ "$actual" == "${{ inputs.php-version }}" ]]
          [[ "$actual" == "8.3" ]]
          php-ci-doctor --json
      - name: Run PHP family checks
        uses: OXY7O/platform-workflow/actions/php-family-check@94cd54f1bceaa3ee334c10f14c68f768123e828e
        with:
          working-directory: ${{ inputs.working-directory }}
          dependency-mode: composer-frozen
      - name: Export family result
        id: results
        if: always()
        shell: bash
        run: |
          results_file="${RUNNER_TEMP}/platform-results/checks.jsonl"
          checks=""
          if [[ -f "$results_file" ]]; then
            checks="$(tr '\n' ',' < "$results_file" | sed 's/,$//')"
          fi
          echo "checks-json=[$checks]" >> "$GITHUB_OUTPUT"
