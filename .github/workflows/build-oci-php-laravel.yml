name: Build Laravel OCI image

on:
  workflow_call:
    inputs:
      contract-json:
        description: Governed Laravel OCI build contract
        required: true
        type: string
    outputs:
      image-reference:
        description: Immutable OCI image reference
        value: ${{ jobs.publish.outputs.image-reference }}
      image-digest:
        description: Published OCI manifest digest
        value: ${{ jobs.publish.outputs.image-digest }}
      artifact-id:
        description: Governed artifact identity
        value: ${{ jobs.publish.outputs.artifact-id }}
      source-sha:
        description: Source commit represented by the image
        value: ${{ jobs.publish.outputs.source-sha }}
      provenance-reference:
        description: GitHub build provenance attestation URL
        value: ${{ jobs.publish.outputs.provenance-reference }}
      sbom-reference:
        description: OCI subject carrying the attached SBOM
        value: ${{ jobs.publish.outputs.sbom-reference }}
      evidence-metadata:
        description: Non-secret publication evidence
        value: ${{ jobs.publish.outputs.evidence-metadata }}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      image-reference: ${{ steps.outputs.outputs.image-reference }}
      image-digest: ${{ steps.build.outputs.digest }}
      artifact-id: ${{ fromJSON(inputs.contract-json).artifactId }}
      source-sha: ${{ fromJSON(inputs.contract-json).sourceSha }}
      provenance-reference: ${{ steps.attest.outputs.attestation-url }}
      sbom-reference: ${{ steps.outputs.outputs.sbom-reference }}
      evidence-metadata: ${{ steps.outputs.outputs.evidence-metadata }}
    steps:
      - name: Checkout caller source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate OCI build contract
        id: contract
        uses: OXY7O/platform-workflow/actions/validate-oci-build@00f95fc276c9374ce03fdd22f066d7f78a7a12a1
        with:
          contract-json: ${{ inputs.contract-json }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Authenticate to private GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: ${{ fromJSON(steps.contract.outputs.canonical-contract).contextPath }}
          file: ${{ fromJSON(steps.contract.outputs.canonical-contract).dockerfilePath }}
          platforms: ${{ steps.contract.outputs.platforms }}
          push: true
          tags: ${{ steps.contract.outputs.image-repository }}:sha-${{ fromJSON(inputs.contract-json).sourceSha }}
          provenance: false
          sbom: true
          cache-from: type=gha,scope=php-laravel-oci
          cache-to: type=gha,scope=php-laravel-oci,mode=max

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ steps.contract.outputs.image-repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Export immutable outputs and safe evidence
        id: outputs
        env:
          IMAGE_REPOSITORY: ${{ steps.contract.outputs.image-repository }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          ARTIFACT_ID: ${{ fromJSON(inputs.contract-json).artifactId }}
          SOURCE_SHA: ${{ fromJSON(inputs.contract-json).sourceSha }}
          CONTRACT_DIGEST: ${{ steps.contract.outputs.contract-digest }}
          PROVENANCE_REFERENCE: ${{ steps.attest.outputs.attestation-url }}
        run: |
          image_reference="${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"
          evidence="$(node -e 'console.log(JSON.stringify({schemaVersion:"1.0",governanceVersion:"v1.5.0",catalogueVersion:"1.2.0",profileKey:"php-laravel",artifactId:process.env.ARTIFACT_ID,sourceSha:process.env.SOURCE_SHA,contractDigest:process.env.CONTRACT_DIGEST,imageReference:process.env.IMAGE_REPOSITORY+"@"+process.env.IMAGE_DIGEST,imageDigest:process.env.IMAGE_DIGEST,provenanceReference:process.env.PROVENANCE_REFERENCE,sbomReference:process.env.IMAGE_REPOSITORY+"@"+process.env.IMAGE_DIGEST}))')"
          {
            echo "image-reference=$image_reference"
            echo "sbom-reference=$image_reference"
            echo "evidence-metadata=$evidence"
          } >> "$GITHUB_OUTPUT"
