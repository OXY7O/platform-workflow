name: Reusable PHP Laravel Compatibility CI
on:
  workflow_call:
    inputs:
      contract-json: {required: true, type: string}
      php-version: {required: true, type: string}
      working-directory: {required: true, type: string}
      test-profile: {required: false, type: string, default: phpunit}
    outputs:
      readiness: {value: "${{ jobs.compatibility.outputs.readiness }}"}
      failure-category: {value: "${{ jobs.compatibility.outputs.failure-category }}"}
      contract-digest: {value: "${{ jobs.compatibility.outputs.contract-digest }}"}
      lock-digest: {value: "${{ jobs.compatibility.outputs.lock-digest }}"}
      evidence-metadata: {value: "${{ jobs.compatibility.outputs.evidence-metadata }}"}
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: [self-hosted, platform-ci]
    env:
      COMPOSER_ALLOW_SUPERUSER: "1"
      COMPOSER_CACHE_DIR: /var/cache/platform/composer
    container:
      image: ${{ inputs.php-version == '8.2' && 'php:8.2-cli-bookworm@sha256:6ca4b01d84082465358c5d541a2bef0edd9d0be494802aeb40f2d7c7a8d73adb' || inputs.php-version == '8.3' && 'php:8.3-cli-bookworm@sha256:177529735599a8244b2c903522f029839dce1c2ac4be122fdc00ada4b45a20e4' || inputs.php-version == '8.4' && 'php:8.4-cli-bookworm@sha256:9cc9310a457019cd6b682109eb3c5dd8bf73498e7d3b9ee5c33d0d0b83d0faf3' || inputs.php-version == '8.5' && 'php:8.5-cli-bookworm@sha256:b80dfc7d2bc0fc97755620a0dfb3d5e8e9cbf70a2970ea2d5c9dc64154b31422' || '' }}
      volumes:
        - platform-ci-composer-php-${{ inputs.php-version }}:/var/cache/platform/composer
    outputs:
      readiness: "${{ steps.result.outputs.readiness }}"
      failure-category: "${{ steps.result.outputs.failure-category }}"
      contract-digest: "${{ steps.contract.outputs.contract-digest }}"
      lock-digest: "${{ steps.lock.outputs.digest }}"
      evidence-metadata: "${{ steps.result.outputs.evidence-metadata }}"
    steps:
      - name: Checkout caller source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate compatibility contract
        id: contract
        uses: OXY7O/platform-workflow/actions/validate-compatibility-contract@40b7d0bd8a4c4cf98e7b938518cfad2a9a55094b
        with: {contract: "${{ inputs.contract-json }}"}
      - name: Configure PHP tooling in job container
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with: {php-version: "${{ inputs.php-version }}", tools: composer, coverage: xdebug}
      - name: Recreate frozen dependencies
        uses: OXY7O/platform-workflow/actions/php-family-check@40b7d0bd8a4c4cf98e7b938518cfad2a9a55094b
        with: {working-directory: "${{ inputs.working-directory }}", dependency-mode: composer-frozen}
      - name: Run Laravel checks
        uses: OXY7O/platform-workflow/actions/laravel-profile-check@40b7d0bd8a4c4cf98e7b938518cfad2a9a55094b
        with: {working-directory: "${{ inputs.working-directory }}", test-profile: "${{ inputs.test-profile }}"}
      - name: Resolve lock digest
        id: lock
        working-directory: "${{ inputs.working-directory }}"
        run: echo "digest=sha256:$(sha256sum composer.lock | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Emit safe result
        id: result
        env:
          CONTRACT_JSON: "${{ inputs.contract-json }}"
          CONTRACT_DIGEST: "${{ steps.contract.outputs.contract-digest }}"
          LOCK_DIGEST: "${{ steps.lock.outputs.digest }}"
          PLATFORM_RUNNER_NAME: "${{ runner.name }}"
        run: |
          echo "readiness=passed" >> "$GITHUB_OUTPUT"
          echo "failure-category=" >> "$GITHUB_OUTPUT"
          value="$(node -e 'const c=JSON.parse(process.env.CONTRACT_JSON);console.log(JSON.stringify({schemaVersion:"1.0",laneId:c.laneId,frameworkMajor:c.frameworkMajor,phpVersion:c.phpVersion,lifecycle:c.lifecycle,blocking:c.blocking,sourceSha:process.env.GITHUB_SHA,workflowSha:"40b7d0bd8a4c4cf98e7b938518cfad2a9a55094b",contractDigest:process.env.CONTRACT_DIGEST,lockDigest:process.env.LOCK_DIGEST,runnerImage:process.env.PLATFORM_RUNNER_NAME,conclusion:"passed"}))')"
          echo "evidence-metadata=$value" >> "$GITHUB_OUTPUT"
