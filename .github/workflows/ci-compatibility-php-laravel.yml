name: Reusable PHP Laravel Compatibility CI
on:
  workflow_call:
    inputs:
      contract-json: {required: true, type: string}
      php-version: {required: true, type: string}
      working-directory: {required: true, type: string}
      test-profile: {required: false, type: string, default: phpunit}
    outputs:
      readiness: {value: "${{ jobs.compatibility.outputs.readiness }}"}
      failure-category: {value: "${{ jobs.compatibility.outputs.failure-category }}"}
      contract-digest: {value: "${{ jobs.compatibility.outputs.contract-digest }}"}
      lock-digest: {value: "${{ jobs.compatibility.outputs.lock-digest }}"}
      evidence-metadata: {value: "${{ jobs.compatibility.outputs.evidence-metadata }}"}
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-24.04
    outputs:
      readiness: "${{ steps.result.outputs.readiness }}"
      failure-category: "${{ steps.result.outputs.failure-category }}"
      contract-digest: "${{ steps.contract.outputs.contract-digest }}"
      lock-digest: "${{ steps.lock.outputs.digest }}"
      evidence-metadata: "${{ steps.result.outputs.evidence-metadata }}"
    steps:
      - name: Checkout caller source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate compatibility contract
        id: contract
        uses: OXY7O/platform-workflow/actions/validate-compatibility-contract@40e05f3836057235b31b2423a3808e565fccca75
        with: {contract: "${{ inputs.contract-json }}"}
      - name: Configure PHP runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with: {php-version: "${{ inputs.php-version }}", tools: composer, coverage: xdebug}
      - name: Recreate frozen dependencies
        uses: OXY7O/platform-workflow/actions/php-family-check@40e05f3836057235b31b2423a3808e565fccca75
        with: {working-directory: "${{ inputs.working-directory }}", dependency-mode: composer-frozen}
      - name: Run Laravel checks
        uses: OXY7O/platform-workflow/actions/laravel-profile-check@40e05f3836057235b31b2423a3808e565fccca75
        with: {working-directory: "${{ inputs.working-directory }}", test-profile: "${{ inputs.test-profile }}"}
      - name: Resolve lock digest
        id: lock
        working-directory: "${{ inputs.working-directory }}"
        run: echo "digest=sha256:$(sha256sum composer.lock | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Emit safe result
        id: result
        env:
          CONTRACT_JSON: "${{ inputs.contract-json }}"
          CONTRACT_DIGEST: "${{ steps.contract.outputs.contract-digest }}"
          LOCK_DIGEST: "${{ steps.lock.outputs.digest }}"
        run: |
          echo "readiness=passed" >> "$GITHUB_OUTPUT"
          echo "failure-category=" >> "$GITHUB_OUTPUT"
          value="$(node -e 'const c=JSON.parse(process.env.CONTRACT_JSON);console.log(JSON.stringify({schemaVersion:"1.0",laneId:c.laneId,frameworkMajor:c.frameworkMajor,phpVersion:c.phpVersion,lifecycle:c.lifecycle,blocking:c.blocking,sourceSha:process.env.GITHUB_SHA,workflowSha:"40e05f3836057235b31b2423a3808e565fccca75",contractDigest:process.env.CONTRACT_DIGEST,lockDigest:process.env.LOCK_DIGEST,runnerImage:"ubuntu-24.04",conclusion:"passed"}))')"
          echo "evidence-metadata=$value" >> "$GITHUB_OUTPUT"
