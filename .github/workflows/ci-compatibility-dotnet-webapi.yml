name: Reusable .NET Web API Compatibility CI

on:
  workflow_call:
    inputs:
      contract-json: {required: true, type: string}
    outputs:
      readiness:
        value: ${{ jobs.compatibility.outputs.readiness }}
      failure-category:
        value: ${{ jobs.compatibility.outputs.failure-category }}
      contract-digest:
        value: ${{ jobs.compatibility.outputs.contract-digest }}
      dependency-digest:
        value: ${{ jobs.compatibility.outputs.dependency-digest }}
      evidence-metadata:
        value: ${{ jobs.compatibility.outputs.evidence-metadata }}

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    outputs:
      readiness: ${{ steps.normalize.outputs.readiness }}
      failure-category: ${{ steps.normalize.outputs.failure-category }}
      contract-digest: ${{ steps.contract.outputs.contract-digest }}
      dependency-digest: ${{ steps.dependencies.outputs.digest }}
      evidence-metadata: ${{ steps.normalize.outputs.evidence-metadata }}
    steps:
      - name: Checkout caller source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate preview compatibility contract
        id: contract
        uses: OXY7O/platform-workflow/actions/validate-dotnet-compatibility-contract@6e8335bd6bdbb829cf7fed468b0517e8a54a7c73
        with:
          contract-json: ${{ inputs.contract-json }}
      - name: Configure exact .NET 11 preview SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: |
            10.0.110
            11.0.100-preview.6.26359.118
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Select exact preview SDK for compatibility execution
        shell: bash
        run: |
          node -e 'const fs=require("fs");const value=JSON.parse(fs.readFileSync("global.json","utf8"));value.sdk.version="11.0.100-preview.6.26359.118";value.sdk.allowPrerelease=true;fs.writeFileSync("global.json", `${JSON.stringify(value, null, 2)}\n`);'
      - name: Run preview family checks
        id: family
        continue-on-error: true
        uses: OXY7O/platform-workflow/actions/dotnet-family-check@6e8335bd6bdbb829cf7fed468b0517e8a54a7c73
        with:
          solution-path: ${{ fromJSON(inputs.contract-json).solutionPath }}
          project-path: ${{ fromJSON(inputs.contract-json).projectPath }}
          test-project-path: ${{ fromJSON(inputs.contract-json).testProjectPath }}
          sdk-version: 11.0.100-preview.6.26359.118
          coverage-threshold: ${{ fromJSON(inputs.contract-json).coverageThreshold }}
      - name: Validate preview Web API publish
        id: profile
        continue-on-error: true
        uses: OXY7O/platform-workflow/actions/dotnet-webapi-check@6e8335bd6bdbb829cf7fed468b0517e8a54a7c73
        with:
          project-path: ${{ fromJSON(inputs.contract-json).projectPath }}
          target-framework: net10.0
          runtime-identifier: linux-x64
          publish-directory: ${{ runner.temp }}/dotnet-preview/publish
      - name: Resolve locked dependency digest
        id: dependencies
        env:
          PROJECT_PATH: ${{ fromJSON(inputs.contract-json).projectPath }}
          TEST_PROJECT_PATH: ${{ fromJSON(inputs.contract-json).testProjectPath }}
        run: |
          project_lock="$(dirname "$PROJECT_PATH")/packages.lock.json"
          test_lock="$(dirname "$TEST_PROJECT_PATH")/packages.lock.json"
          digest="$(sha256sum "$project_lock" "$test_lock" | sort -k2 | sha256sum | cut -d ' ' -f1)"
          echo "digest=sha256:$digest" >> "$GITHUB_OUTPUT"
      - name: Normalize preview result
        id: normalize
        if: always()
        uses: OXY7O/platform-workflow/actions/normalize-check-results@6e8335bd6bdbb829cf7fed468b0517e8a54a7c73
        with:
          checks: >-
            [{"id":"contract","required":true,"status":"${{ steps.contract.outcome == 'success' && 'passed' || 'failed' }}","failureCategory":${{ steps.contract.outcome == 'success' && 'null' || '"contract"' }},"safeDiagnostic":null},{"id":"dotnet-family","required":true,"status":"${{ steps.family.outcome == 'success' && 'passed' || 'failed' }}","failureCategory":${{ steps.family.outcome == 'success' && 'null' || '"quality"' }},"safeDiagnostic":null},{"id":"dotnet-webapi","required":true,"status":"${{ steps.profile.outcome == 'success' && 'passed' || 'failed' }}","failureCategory":${{ steps.profile.outcome == 'success' && 'null' || '"configuration"' }},"safeDiagnostic":null}]
          evidence: >-
            {"schemaVersion":"1.0","governanceVersion":"v1.3.0","catalogueVersion":"1.3.0","profileKey":"dotnet-webapi","sourceSha":"${{ github.sha }}","workflowSha":"6e8335bd6bdbb829cf7fed468b0517e8a54a7c73","contractDigest":"${{ steps.contract.outputs.contract-digest }}","runnerClass":"linux-x64","runnerImage":"ubuntu-24.04","artifact":null,"evidenceReference":null}
